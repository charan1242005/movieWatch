services:
  - type: web
    name: moviewatch-api
    runtime: python
    repo: https://github.com/charan1242005/movieWatch
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moviewatch-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://moviewatch.vercel.app

databases:
  - name: moviewatch-db
    plan: free
    region: singapore
    postgresMajorVersion: 18
