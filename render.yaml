services:
  - type: web
    name: moviewatch-api
    runtime: python
    repo: https://github.com/charan1242005/movieWatch
    branch: main
    rootDir: .
    buildCommand: bash overrides/render-build.sh
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://moviewatch.vercel.app
